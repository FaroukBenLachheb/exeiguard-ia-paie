[pytest]
; extracteur-evp/tests et compliance-validation/tests portent chacun un
; conftest.py dans un dossier nommé "tests" (le nom du service parent
; contient un tiret, donc pas un package Python valide au-dessus) :
; sans --import-mode=importlib, pytest resout les deux vers le meme nom
; de module "tests.conftest" et refuse la collecte (plugin deja
; enregistre sous un nom different).
addopts = --import-mode=importlib
