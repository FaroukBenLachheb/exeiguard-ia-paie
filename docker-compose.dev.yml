# docker-compose.dev.yml — environnement de developpement
#
# Sert a valider que chaque service se construit et demarre correctement
# en local, en preparation de l'integration sur la VM GPU (pas de GPU en
# local : la reservation GPU de llm-server reste commentee ci-dessous).
#
# JOUR 1 (cablage reel du pipeline, verifie en local le 10/09) :
# extracteur-evp (POST /extraire), compliance-validation (POST /evaluer)
# et integration-sage (POST /calculer, mock deterministe en attendant
# l'API Sage reelle, voir integration-sage/README.md) exposent desormais
# leur logique metier, et l'orchestrateur les appelle reellement (httpx)
# a chaque transition A1->A6 concernee, au lieu de se contenter de
# changer un statut en base.
#
# JOUR 4 : frontend (Streamlit, frontend/app.py) conteneurise a son tour,
# dernier service applicatif du pipeline a l'etre. Comme qdrant et
# llm-server, son port n'est publie que sur 127.0.0.1 (jamais 0.0.0.0) :
# accessible depuis l'exterieur uniquement via tunnel SSH.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-exeiguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exeiguard_paie}
      POSTGRES_DB: ${POSTGRES_DB:-exeiguard_poc}
    ports:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - exeiguard_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-exeiguard} -d ${POSTGRES_DB:-exeiguard_poc}"]
      interval: 5s
      timeout: 3s
      retries: 5

  orchestrateur:
    build:
      context: .
      dockerfile: orchestrateur/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-exeiguard}:${POSTGRES_PASSWORD:-exeiguard_paie}@postgres:5432/${POSTGRES_DB:-exeiguard_poc}
    ports:
      - "8000:8000"
    # Port publie temporairement pour le developpement actif sur la VM OVH :
    # a retirer avant toute mise en situation reelle. En Phase 9 (Traefik),
    # seul le port 443 sera expose publiquement et orchestrateur repassera
    # en "expose" comme les autres services internes.
    networks:
      - exeiguard_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  extracteur-evp:
    build:
      context: .
      dockerfile: extracteur-evp/Dockerfile
    expose:
      - "8000"
    networks:
      - exeiguard_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  compliance-validation:
    build:
      context: .
      dockerfile: compliance-validation/Dockerfile
    expose:
      - "8000"
    networks:
      - exeiguard_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  integration-sage:
    build:
      context: .
      dockerfile: integration-sage/Dockerfile
    expose:
      - "8000"
    networks:
      - exeiguard_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  llm-server:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    expose:
      - "11434"
    # Le port 11434 n'est publie sur le host ni ouvert dans le firewall :
    # seuls les autres conteneurs du reseau docker-compose y accedent
    # (endpoint compatible OpenAI sur http://llm-server:11434/v1, voir
    # llm/README.md).
    networks:
      - exeiguard_net
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    #
    # Reservation GPU : actif uniquement sur la VM GPU cible (OVH, NVIDIA
    # L4 24 Go) avec le NVIDIA Container Toolkit installe sur l'hote. Reste
    # commente ici car il n'y a pas de GPU/toolkit en local : le decommenter
    # ferait echouer `docker compose up` en dev. Voir docker-compose.yml
    # (Phase 9) pour la version active sur la VM cible.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           capabilities: [gpu]
    #           count: 1

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    expose:
      - "6333"
      - "6334"
    networks:
      - exeiguard_net
    # Base vectorielle du RAG (rag/app/ingestion/ingest.py,
    # rag/app/main.py), meme config que docker-compose.yml (VM cible).
    #
    # Healthcheck TCP via bash (image qdrant sans curl/wget) : necessaire
    # pour que le "condition: service_healthy" de rag ci-dessous soit une
    # config Compose valide. NON TESTE - a verifier reellement sur la VM.
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rag:
    build:
      context: .
      dockerfile: rag/Dockerfile
    environment:
      OLLAMA_HOST: llm-server
      QDRANT_HOST: qdrant
    ports:
      - "8001:8000"
    # Port publié sur l'hôte (JOUR 2, mis à jour JOUR 4) : le service
    # frontend (Streamlit, conteneurisé ci-dessous) appelle POST
    # /rag/query directement sur ce service via RAG_URL=http://rag:8000
    # (nom de service Docker), comme orchestrateur ci-dessus. Le port
    # 8001 reste publié sur l'hôte pour du débogage direct depuis la
    # machine hôte (dev local actif, à retirer avant mise en situation
    # réelle - cf. commentaire sur le service orchestrateur).
    expose:
      - "8000"
    volumes:
      - ./docs/architecture/references:/docs/architecture/references:ro
    networks:
      - exeiguard_net
    depends_on:
      qdrant:
        condition: service_healthy
      llm-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      ORCHESTRATEUR_URL: http://orchestrateur:8000
      RAG_URL: http://rag:8000
      # JOUR 4 : écran 0 "Nouveau salarié", appelle POST /extraire-contrat
      # directement sur extracteur-evp (jamais publié sur l'hôte, cf. son
      # service ci-dessus - uniquement joignable via le réseau Docker).
      EXTRACTEUR_EVP_URL: http://extracteur-evp:8000
    ports:
      - "127.0.0.1:8501:8501"
    # Meme logique de securite que qdrant/llm-server ci-dessus : accessible
    # uniquement depuis la machine hote (tunnel SSH depuis l'exterieur),
    # jamais expose publiquement sur 0.0.0.0. C'est l'interface destinee a
    # etre montree au CEO (cf. frontend/app.py), pas un service interne au
    # pipeline, mais elle n'a pas vocation a etre publique pour autant.
    networks:
      - exeiguard_net
    depends_on:
      orchestrateur:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  exeiguard_net:
    driver: bridge

volumes:
  postgres_data:
  ollama_models:
  qdrant_data:
